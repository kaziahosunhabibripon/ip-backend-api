services:
  api:
    build: .
    env_file: .env
    ports: ["4000:4000"]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ipscope
      POSTGRES_PASSWORD: ipscope
      POSTGRES_DB: ipscope
    # Host port 5433, not 5432: on this machine a native (non-Docker) postgres.exe
    # already owns 5432, and Windows silently routes new connections to it instead
    # of this container — same host, unrelated server, very confusing to debug.
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports: ["6380:6379"]

volumes:
  postgres_data:
